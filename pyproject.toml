[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-professor"
version = "0.0.1"
description = "An AI-native curriculum harness: a source-grounded curriculum DAG worked through with isolated teaching and adversarial, deterministic gating."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "riley" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
# Fallback LLM backends (Anthropic / OpenAI-standard / Ollama-local). Lazy-imported by
# provider/backends.py so the package imports fine without it. The OAuth Codex backend
# is implemented directly and needs only httpx.
llm = [
    "litellm>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_professor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
